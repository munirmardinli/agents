name: Release

on:
  push:
    branches:
      - "**"

permissions:
  contents: read

jobs:
  validate:
    name: Validate on Node.js ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Compile and generate agent files
        run: npm run generate

  publish:
    name: Create GitHub release
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Create release with generated notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RELEASE_TAG=$(node --input-type=module -e 'import { readFileSync } from "node:fs"; const { version } = JSON.parse(readFileSync("package.json", "utf8")); console.log(`v${version}-${process.env.GITHUB_SHA.slice(0, 12)}-${process.env.GITHUB_RUN_ID}`)')
          gh release create "$RELEASE_TAG" \
            --target "$GITHUB_SHA" \
            --title "$RELEASE_TAG" \
            --generate-notes
