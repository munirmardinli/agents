name: Release

on:
  push:
    branches:
      - "**"

permissions:
  contents: read

jobs:
  validate:
    name: Validate on Node.js ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Compile and generate agent files
        run: npm run build

  publish:
    name: Create GitHub release
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate platform agents
        run: npm run build

      - name: Package agents
        run: |
          RELEASE_TAG=$(node --input-type=module -e 'import { readFileSync } from "node:fs"; const { version } = JSON.parse(readFileSync("package.json", "utf8")); console.log(`v${version}-${process.env.GITHUB_SHA.slice(0, 12)}-${process.env.GITHUB_RUN_ID}`)')
          zip -r "agents-${RELEASE_TAG}.zip" \
            .claude/agents \
            .github/agents \
            .cursor/agents \
            .gemini/agents
          echo "RELEASE_TAG=$RELEASE_TAG" >> "$GITHUB_ENV"

      - name: Create release with generated agents
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RELEASE_TAG=$(node --input-type=module -e 'import { readFileSync } from "node:fs"; const { version } = JSON.parse(readFileSync("package.json", "utf8")); console.log(`v${version}-${process.env.GITHUB_SHA.slice(0, 12)}-${process.env.GITHUB_RUN_ID}`)')
          gh release create "$RELEASE_TAG" \
            --target "$GITHUB_SHA" \
            --title "$RELEASE_TAG" \
            --generate-notes \
            "agents-${RELEASE_TAG}.zip#Generated agents for Claude, VS Code, Cursor, and Gemini"
